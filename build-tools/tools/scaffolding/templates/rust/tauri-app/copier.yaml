version: 1

_envops:
  block_start_string: "{%"
  block_end_string: "%}"
  variable_start_string: "{{"
  variable_end_string: "}}"
  comment_start_string: "{#"
  comment_end_string: "#}"
  keep_trailing_newline: true

_exclude:
  - meta.json

name: ""
language: "rust"
template: "tauri-app"
targets:
  type: yaml
  default: ["desktop-darwin"]
android_package: ""
android_min_sdk: 24
android_compile_sdk: 35
ios_bundle_identifier: ""
ios_deployment_target: "17.0"
include_mobile_release_placeholders: false
enable_mobile_scaffold_targets: false

_templates_suffix: ".jinja"
_answers_file: ".copier-answers.yml"
_tasks: []
